<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<title>Relógio Digital Online</title>
<meta name="description" content="Acompanhe a hora certa com este relógio digital online, rápido, seguro e sem anúncios.">
<meta name="robots" content="index, follow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Mono:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0b1220;
    --card: #141d31;
    --card-2: #0f1729;
    --line: #263349;
    --text: #e9edf5;
    --text-dim: #8996ad;
    --accent: #5eead4;
    --accent-glow: rgba(94, 234, 212, .35);
    --radius-lg: 22px;
    --radius-md: 14px;
    --radius-sm: 10px;
    --shadow: 0 20px 45px rgba(0,0,0,.45);
  }

  *{ margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
  html{ -webkit-text-size-adjust: 100%; }

  body{
    font-family: 'Inter', system-ui, sans-serif;
    background:
      radial-gradient(circle at 15% 0%, rgba(94,234,212,.08), transparent 45%),
      radial-gradient(circle at 85% 100%, rgba(94,234,212,.05), transparent 45%),
      var(--bg);
    color: var(--text);
    min-height: 100dvh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: max(20px, env(safe-area-inset-top)) 16px max(20px, env(safe-area-inset-bottom));
  }

  .card{
    background: linear-gradient(180deg, var(--card), var(--card-2));
    width: 100%;
    max-width: 420px;
    padding: 40px 26px 32px;
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow);
    text-align: center;
    border: 1px solid var(--line);
  }

  /* ---------- Tela 1: verificação ---------- */
  #captcha-screen{
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    width: 100%;
  }

  .aviso{ font-size: .98rem; color: var(--text-dim); }

  .checkbox-box{
    background: var(--card-2);
    border: 1px solid var(--line);
    padding: 16px;
    border-radius: var(--radius-md);
    width: 100%;
    display: flex;
    align-items: center;
    gap: 15px;
    cursor: pointer;
    transition: .2s;
  }
  .checkbox-box:hover{ border-color: var(--accent); }

  .checkbox-box input{
    width: 24px; height: 24px;
    cursor: pointer;
    accent-color: var(--accent);
    flex-shrink: 0;
  }

  .checkbox-box label{
    font-size: 1.05rem;
    color: var(--text);
    cursor: pointer;
    user-select: none;
    text-align: left;
  }

  .checkbox-box.checking label::after{
    content: '';
  }

  /* ---------- Tela 2: relógio ---------- */
  #clock-screen{
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    width: 100%;
  }

  .status-badge{
    font-family:'IBM Plex Mono', monospace;
    background: rgba(94,234,212,.1);
    color: var(--accent);
    padding: 7px 16px;
    border-radius: 30px;
    font-size: .78rem;
    letter-spacing: .5px;
    border: 1px solid rgba(94,234,212,.3);
  }

  h1.time{
    font-family: 'Space Grotesk', sans-serif;
    font-size: clamp(2.6rem, 12vw, 4.4rem);
    font-weight: 700;
    letter-spacing: 1px;
    color: var(--text);
    text-shadow: 0 0 30px var(--accent-glow);
    font-variant-numeric: tabular-nums;
    margin: 4px 0 0;
  }

  .period{
    font-family: 'IBM Plex Mono', monospace;
    font-size: .9rem;
    color: var(--accent);
    letter-spacing: 1px;
  }

  .date{
    font-size: 1.02rem;
    color: var(--text-dim);
    text-transform: capitalize;
    letter-spacing: .3px;
  }

  .meta-row{
    display: flex;
    gap: 8px;
    align-items: center;
    font-family: 'IBM Plex Mono', monospace;
    font-size: .72rem;
    color: var(--text-dim);
  }
  .meta-row .dot{ width:3px; height:3px; border-radius:50%; background: var(--text-dim); }

  /* barra de progresso do dia */
  .day-progress{
    width: 100%;
    margin-top: 4px;
  }
  .day-progress-track{
    width: 100%;
    height: 6px;
    background: var(--card-2);
    border: 1px solid var(--line);
    border-radius: 30px;
    overflow: hidden;
  }
  .day-progress-fill{
    height: 100%;
    background: var(--accent);
    border-radius: 30px;
    width: 0%;
    transition: width 1s linear;
    box-shadow: 0 0 10px var(--accent-glow);
  }
  .day-progress-label{
    display:flex;
    justify-content: space-between;
    font-size: .68rem;
    color: var(--text-dim);
    font-family: 'IBM Plex Mono', monospace;
    margin-top: 6px;
  }

  .actions{
    display: flex;
    gap: 10px;
    width: 100%;
    margin-top: 6px;
  }

  button{
    font-family: 'Inter', sans-serif;
    border: none;
    cursor: pointer;
    font-weight: 600;
    font-size: .85rem;
    border-radius: var(--radius-sm);
    padding: 11px 8px;
    flex: 1;
    background: transparent;
    color: var(--text-dim);
    border: 1px solid var(--line);
    transition: transform .15s ease, border-color .2s ease, color .2s ease;
    touch-action: manipulation;
  }
  button:active{ transform: scale(.96); }
  button:hover{ border-color: var(--accent); color: var(--text); }
  button.active{ background: var(--accent); color: #08211c; border-color: var(--accent); }

  @media (max-width: 380px){
    .card{ padding: 30px 18px 26px; border-radius: 20px; }
    .actions{ flex-wrap: wrap; }
    .actions button{ flex: 1 1 calc(50% - 5px); }
  }

  .sr-only{
    position: absolute; width: 1px; height: 1px;
    overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap;
  }
</style>
</head>
<body>

<div class="card">

  <!-- Tela de verificação -->
  <div id="captcha-screen">
    <p class="aviso">Verificação de segurança</p>
    <label class="checkbox-box" id="checkboxBox">
      <input type="checkbox" id="robotCheck">
      <span>Não sou um robô</span>
    </label>
  </div>

  <!-- Tela do relógio -->
  <div id="clock-screen">
    <div class="status-badge" id="greeting">Acesso liberado</div>

    <h1 class="time" id="clock" aria-label="Horário atual">00:00:00</h1>
    <div class="period" id="period"></div>
    <div class="date" id="date">Carregando data...</div>

    <div class="meta-row">
      <span id="timezone">—</span>
      <span class="dot"></span>
      <span id="weekNumber">—</span>
    </div>

    <div class="day-progress">
      <div class="day-progress-track">
        <div class="day-progress-fill" id="dayFill"></div>
      </div>
      <div class="day-progress-label">
        <span>Dia iniciado</span>
        <span id="dayPercent">0%</span>
      </div>
    </div>

    <div class="actions">
      <button id="btnFormat" aria-pressed="false">24h</button>
      <button id="btnCopy">Copiar hora</button>
      <button id="btnFullscreen">Tela cheia</button>
    </div>
  </div>

</div>

<script>
(() => {
  'use strict';

  /* ============================================================
     TELA 1 — VERIFICAÇÃO
     Correção de bug: o box inteiro agora é um <label>, então
     clicar em qualquer parte (texto, padding ou checkbox) alterna
     o checkbox exatamente uma vez — sem duplo toggle nem
     necessidade de sincronizar manualmente o estado via JS.
  ============================================================ */
  const checkbox = document.getElementById('robotCheck');
  const captchaScreen = document.getElementById('captcha-screen');
  const clockScreen = document.getElementById('clock-screen');

  checkbox.addEventListener('change', () => {
    if (!checkbox.checked) return;
    checkbox.disabled = true; // evita re-clique durante a transição
    setTimeout(() => {
      captchaScreen.style.display = 'none';
      clockScreen.style.display = 'flex';
      Clock.init();
    }, 350);
  });

  /* ============================================================
     TELA 2 — RELÓGIO
  ============================================================ */
  const Clock = (() => {
    const el = {
      clock: document.getElementById('clock'),
      period: document.getElementById('period'),
      date: document.getElementById('date'),
      greeting: document.getElementById('greeting'),
      timezone: document.getElementById('timezone'),
      weekNumber: document.getElementById('weekNumber'),
      dayFill: document.getElementById('dayFill'),
      dayPercent: document.getElementById('dayPercent'),
      btnFormat: document.getElementById('btnFormat'),
      btnCopy: document.getElementById('btnCopy'),
      btnFullscreen: document.getElementById('btnFullscreen'),
    };

    const DIAS = ['Domingo', 'Segunda-feira', 'Terça-feira', 'Quarta-feira', 'Quinta-feira', 'Sexta-feira', 'Sábado'];
    const MESES = ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho', 'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'];

    let format24h = true;
    let intervalId = null;

    function getWeekNumber(d) {
      const date = new Date(d.getTime());
      date.setHours(0, 0, 0, 0);
      date.setDate(date.getDate() + 3 - (date.getDay() + 6) % 7);
      const week1 = new Date(date.getFullYear(), 0, 4);
      return 1 + Math.round(((date - week1) / 86400000 - 3 + (week1.getDay() + 6) % 7) / 7);
    }

    function greetingFor(hour) {
      if (hour < 6) return 'Boa madrugada';
      if (hour < 12) return 'Bom dia';
      if (hour < 18) return 'Boa tarde';
      return 'Boa noite';
    }

    function update() {
      const now = new Date();
      const h24 = now.getHours();
      const minutos = String(now.getMinutes()).padStart(2, '0');
      const segundos = String(now.getSeconds()).padStart(2, '0');

      if (format24h) {
        el.clock.textContent = `${String(h24).padStart(2, '0')}:${minutos}:${segundos}`;
        el.period.textContent = '';
      } else {
        const h12 = h24 % 12 === 0 ? 12 : h24 % 12;
        el.clock.textContent = `${String(h12).padStart(2, '0')}:${minutos}:${segundos}`;
        el.period.textContent = h24 >= 12 ? 'PM' : 'AM';
      }

      el.date.textContent = `${DIAS[now.getDay()]}, ${now.getDate()} de ${MESES[now.getMonth()]} de ${now.getFullYear()}`;
      el.greeting.textContent = greetingFor(h24);
      el.weekNumber.textContent = `Semana ${getWeekNumber(now)}`;

      const secondsToday = h24 * 3600 + now.getMinutes() * 60 + now.getSeconds();
      const pct = (secondsToday / 86400) * 100;
      el.dayFill.style.width = `${pct.toFixed(2)}%`;
      el.dayPercent.textContent = `${pct.toFixed(0)}%`;
    }

    function toggleFormat() {
      format24h = !format24h;
      el.btnFormat.textContent = format24h ? '24h' : '12h';
      el.btnFormat.classList.toggle('active', !format24h);
      el.btnFormat.setAttribute('aria-pressed', String(!format24h));
      update();
    }

    async function copyTime() {
      const text = el.clock.textContent + (el.period.textContent ? ` ${el.period.textContent}` : '');
      try {
        await navigator.clipboard.writeText(text);
        flashButton(el.btnCopy, 'Copiado!');
      } catch {
        flashButton(el.btnCopy, 'Erro ao copiar');
      }
    }

    function flashButton(btn, msg) {
      const original = btn.textContent;
      btn.textContent = msg;
      btn.disabled = true;
      setTimeout(() => { btn.textContent = original; btn.disabled = false; }, 1200);
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen?.().catch(() => {});
        el.btnFullscreen.textContent = 'Sair';
      } else {
        document.exitFullscreen?.();
        el.btnFullscreen.textContent = 'Tela cheia';
      }
    }

    function bindEvents() {
      el.btnFormat.addEventListener('click', toggleFormat);
      el.btnCopy.addEventListener('click', copyTime);
      el.btnFullscreen.addEventListener('click', toggleFullscreen);
      document.addEventListener('fullscreenchange', () => {
        el.btnFullscreen.textContent = document.fullscreenElement ? 'Sair' : 'Tela cheia';
      });
      el.timezone.textContent = Intl.DateTimeFormat().resolvedOptions().timeZone || '—';
    }

    function init() {
      if (intervalId) return; // evita múltiplos intervalos se init for chamado de novo
      bindEvents();
      update();
      intervalId = setInterval(update, 1000);
    }

    return { init };
  })();
})();
</script>
</body>
</html>
