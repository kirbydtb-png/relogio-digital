<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Relógio Digital Online</title>
    <meta name="description" content="Acompanhe a hora certa com este relógio digital online rápido e seguro.">
    <meta name="keywords" content="relógio digital, hora certa, relógio online, web, hora atual">
    <meta name="robots" content="index, follow">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card {
            background: #1e293b;
            width: 100%;
            max-width: 380px; 
            padding: 30px 20px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            text-align: center;
            border: 1px solid #334155;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        #captcha-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            width: 100%;
        }

        .aviso {
            font-size: 0.95rem;
            color: #94a3b8;
        }

        .checkbox-box {
            background: #0f172a;
            border: 1px solid #475569;
            padding: 15px;
            border-radius: 12px;
            width: 100%;
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            margin-top: 10px;
        }

        .checkbox-box input {
            width: 22px;
            height: 22px;
            cursor: pointer;
            accent-color: #38bdf8;
        }

        .checkbox-box label {
            font-size: 1rem;
            color: #e2e8f0;
            cursor: pointer;
            user-select: none;
        }

        #clock-screen {
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            width: 100%;
        }

        .status-badge {
            background: rgba(34, 197, 94, 0.15);
            color: #4ade80;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            border: 1px solid rgba(34, 197, 94, 0.3);
            margin-bottom: 10px;
        }

        h1.time {
            font-size: 3.5rem;
            font-weight: 800;
            letter-spacing: 2px;
            color: #38bdf8;
            font-family: monospace;
            text-shadow: 0 0 20px rgba(56, 189, 248, 0.4);
            margin: 0;
        }

        .date {
            font-size: 1rem;
            color: #94a3b8;
            text-transform: capitalize;
        }

        @media (max-width: 350px) {
            h1.time {
                font-size: 2.8rem;
            }
        }
    </style>
</head>
<body>

    <div class="card">
        
        <div id="captcha-screen">
            <p class="aviso">Verificação de segurança</p>
            <div class="checkbox-box" onclick="marcarCheckbox()">
                <input type="checkbox" id="robotCheck" onclick="event.stopPropagation(); verificarRobo(this)">
                <label for="robotCheck">Não sou um robô</label>
            </div>
        </div>

        <div id="clock-screen">
            <div class="status-badge">✓ Acesso Liberado</div>
            <h1 class="time" id="clock">00:00:00</h1>
            <div class="date" id="date">Carregando data...</div>
        </div>

    </div>

    <script>
        function marcarCheckbox() {
            const check = document.getElementById('robotCheck');
            check.checked = !check.checked;
            verificarRobo(check);
        }

        function verificarRobo(checkbox) {
            if (checkbox.checked) {
                setTimeout(() => {
                    document.getElementById('captcha-screen').style.display = 'none';
                    document.getElementById('clock-screen').style.display = 'flex';
                    iniciarRelogio();
                }, 300);
            }
        }

        function iniciarRelogio() {
            function atualizar() {
                const agora = new Date();
                const horas = String(agora.getHours()).padStart(2, '0');
                const minutos = String(agora.getMinutes()).padStart(2, '0');
                const segundos = String(agora.getSeconds()).padStart(2, '0');
                document.getElementById('clock').innerText = `${horas}:${minutos}:${segundos}`;

                const opcoesData = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
                document.getElementById('date').innerText = agora.toLocaleDateString('pt-BR', opcoesData);
            }
            atualizar();
            setInterval(atualizar, 1000);
        }
    </script>
</body>
</html>
